name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.6+ for --experimental-strip-types, which lets the gate scripts
          # import pricing.ts directly instead of duplicating the numbers.
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      # Fails if an annual price drifts off 10x monthly, if a tier is priced in a
      # currency it is not sold in, if VIP becomes promoted in Egypt, or if any
      # tier's revenue per teaching hour inverts. Each corresponds to a decision
      # that cost real analysis and would be silently undone by a plausible edit.
      - name: Price invariants
        run: npm run check:prices

      # Fails on any Arabic line carrying 2+ embedded Latin tokens. First
      # automated bidi gate in the ecosystem — the bot's bidi_check.py and
      # EEC-MATERIAL's render probe are both manual.
      # The money path. Tested against a REAL SQLite file, not a mock — durability
      # that has only been tested in memory has not been tested. Covers idempotency
      # under retry, server-side pricing (a caller-supplied amount is ignored),
      # refused illegal transitions, and the durability pragmas themselves.
      - name: Order ledger
        run: npm run check:orders

      - name: Bidi
        run: npm run check:bidi

      # This page is RTL by default, so `ml-4` silently mirrors to the wrong side
      # while every test still passes. One `pl-6` added in a hurry is how an RTL
      # layout rots.
      - name: Logical properties
        run: npm run check:logical

      - name: Build
        run: npm run build

      # Boots the real server and fetches the real routes in every currency state.
      #
      # This replaced three gates that read build output. The sales page is dynamic
      # by necessity — it must read a cookie and a geo header to choose a currency —
      # so there is no prerendered HTML for the one route that matters. Fetching the
      # live page is strictly better anyway: it tests the bytes a browser receives,
      # and it exercises the geo-header path that no build artefact could.
      #
      # Covers: dir/lang correctness · bidi (un-isolated Latin in Arabic lines) ·
      # currency isolation (never both EGP and USD in one document) · size budgets
      # split by ownership so a regression is attributable.
      - name: Live page gates
        run: npm run check:live

      # Printed into the job log so the governing metric is always derivable from
      # a CI run rather than remembered from a document.
      - name: Revenue per teaching hour
        run: npm run revenue
